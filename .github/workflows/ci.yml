name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      # Plain checkout on purpose: the guard must not depend on fetching
      # the submodules it validates (an SSH URL would break that fetch).
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: |
          set -eu
          if [ ! -f .gitmodules ]; then echo "no submodules - ok"; exit 0; fi
          bad=$(grep -nE '^[[:space:]]*url[[:space:]]*=' .gitmodules \
              | grep -vE '^[0-9]+:[[:space:]]*url[[:space:]]*=[[:space:]]*https://' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-HTTPS submodule URL(s) break fresh clones and CI:$bad"
            exit 1
          fi
          echo "all submodule URLs HTTPS - ok"

  test:
    runs-on: ubuntu-latest
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - name: Test CLI and generator
        run: go test ./...
      - name: Build browser app
        run: make site
      - name: Verify generated site
        run: |
          test -s build/site/index.html
          test -s build/site/app/index.html
          test -s build/site/app/gopass.wasm
      - name: Check formatting
        run: test -z "$(find . -path ./vendor -prune -o -name '*.go' -type f -print | xargs gofmt -l)"

  build-gui:
    name: GUI (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - name: Install native dependencies
        run: |
          mapfile -t packages < .github/apt/gui-packages.txt
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - name: Build GUI
        run: make gui
      - name: Test GUI logic
        run: cd gui && go test ./...
      - name: Build Debian package
        run: make package-deb
      - uses: actions/upload-artifact@v4
        with:
          name: gopass-gui-linux-${{ matrix.arch }}
          path: build/gopass-gui
          if-no-files-found: error
