name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      # Plain checkout on purpose: the guard must not depend on fetching
      # the submodules it validates (an SSH URL would break that fetch).
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: |
          set -eu
          if [ ! -f .gitmodules ]; then echo "no submodules - ok"; exit 0; fi
          bad=$(grep -nE '^[[:space:]]*url[[:space:]]*=' .gitmodules \
              | grep -vE '^[0-9]+:[[:space:]]*url[[:space:]]*=[[:space:]]*https://' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-HTTPS submodule URL(s) break fresh clones and CI:$bad"
            exit 1
          fi
          echo "all submodule URLs HTTPS - ok"

  test:
    runs-on: ubuntu-latest
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - name: Test CLI and generator
        run: go test ./...
      - name: Build browser app
        run: make site
      - name: Verify generated site
        run: |
          test -s build/site/index.html
          test -s build/site/app/index.html
          test -s build/site/app/pass.wasm
      - name: Check formatting
        run: test -z "$(find . -path ./vendor -prune -o -name '*.go' -type f -print | xargs gofmt -l)"

  build-gui:
    name: GUI (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - name: Install native dependencies
        run: |
          mapfile -t packages < .github/apt/gui-packages.txt
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - name: Build GUI
        run: make gui
      - name: Test GUI logic
        run: cd gui && go test ./...
      - name: Build Debian package
        run: make package-deb
      - uses: actions/upload-artifact@v4
        with:
          name: pass-gui-linux-${{ matrix.arch }}
          path: build/pass-gui
          if-no-files-found: error

  build-android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api36-bt34-ndk28-cmake322
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Android native build
        uses: actions/cache@v4
        with:
          path: |
            droid/app/.cxx
            droid/app/build/intermediates/cxx
          key: android-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('droid/app/src/main/cpp/CMakeLists.txt', 'droid/app/build.gradle', 'native/*.c', 'droid/app/src/main/cpp/*.c', 'vendor/kryon/src/**/*.c', 'vendor/kryon/include/**/*.h', 'vendor/kryon/vendor/raylib/src/**') }}
          restore-keys: |
            android-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x droid/gradlew
          make android-debug
