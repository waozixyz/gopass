name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - name: Test CLI and generator
        run: go test ./...
      - name: Build browser app
        run: make site
      - name: Verify generated site
        run: |
          test -s build/site/index.html
          test -s build/site/app/index.html
          test -s build/site/app/gopass.wasm
      - name: Check formatting
        run: test -z "$(find . -path ./vendor -prune -o -name '*.go' -type f -print | xargs gofmt -l)"

  build-gui:
    name: GUI (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: false
      - name: Install native dependencies
        run: |
          mapfile -t packages < .github/apt/gui-packages.txt
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - name: Build GUI
        run: make gui
      - name: Test GUI logic
        run: cd gui && go test ./...
      - name: Build Debian package
        run: make package-deb
      - uses: actions/upload-artifact@v4
        with:
          name: gopass-gui-linux-${{ matrix.arch }}
          path: build/gopass-gui
          if-no-files-found: error
