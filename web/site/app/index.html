<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121833"><title>Generate — gopass</title><meta name="description" content="Generate a deterministic password locally in your browser."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/styles.css"></head>
<body class="app-page"><header><a class="brand" href="/">gopass</a><nav><a href="/">Home</a><span id="runtime-status">Loading secure generator…</span></nav></header>
<main class="generator-shell"><section class="generator-card"><p class="eyebrow">LOCAL PASSWORD GENERATOR</p><h1>Generate a password</h1><div class="form-grid">
  <label>Site<input id="site" autocomplete="off" placeholder="example.org"></label><label>Login<input id="login" autocomplete="username" placeholder="you@example.org"></label>
  <label class="wide">Master password<span class="password-wrap"><input id="master" type="password" autocomplete="current-password"><button id="reveal" type="button" class="inline">Reveal</button></span></label>
  <label>Length<input id="length" type="number" min="1" max="128" value="16"></label><label>Counter<input id="counter" type="number" min="1" value="1"></label><label>Excluded characters<input id="exclude" autocomplete="off"></label>
  <fieldset class="wide"><legend>Character classes</legend><label><input id="lower" type="checkbox" checked> Lowercase</label><label><input id="upper" type="checkbox" checked> Uppercase</label><label><input id="digits" type="checkbox" checked> Digits</label><label><input id="symbols" type="checkbox" checked> Symbols</label></fieldset>
  <div class="wide actions"><button id="generate" class="button" disabled>Generate</button><button id="copy" class="button secondary" disabled>Copy</button><button id="clear" class="button ghost">Clear</button></div>
  <output id="result" class="wide" aria-live="polite">Your generated password appears here</output><p id="message" class="wide status"></p>
</div></section></main><script src="wasm_exec.js"></script><script src="app.js"></script></body></html>
