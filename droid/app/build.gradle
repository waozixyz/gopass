plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.pass'
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def getKeystorePath = { -> project.findProperty('keystore.path') ?: keystoreProps['keystore.path'] ?: System.getenv("HOME") + "/.android/pass-release.keystore" }
    def getKeystoreAlias = { -> project.findProperty('keystore.alias') ?: keystoreProps['keystore.alias'] ?: "pass-key" }

    def releasePassword = project.findProperty('keystore.password') ?: ""

    signingConfigs {
        release {
            storeFile getKeystorePath() ? file(getKeystorePath()) : null
            storePassword releasePassword
            keyAlias getKeystoreAlias()
            keyPassword releasePassword
        }
    }

    defaultConfig {
        applicationId 'xyz.waozi.pass'
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName "0.2.2"
        // Default to the two realistic phone targets; override with
        // -Pabi=x86_64 etc. for emulator builds.
        def abis = project.findProperty('abi') ?: 'armeabi-v7a,arm64-v8a'
        ndk {
            abis.split(',').collect { it.trim() }.each { abiFilters it }
        }
    }

    buildTypes {
        release {
            signingConfig project.hasProperty('fDroidBuild') ? null : signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
